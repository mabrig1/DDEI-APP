name: Security checks
on:
  pull_request:
  push:
    branches: [main, security/devshield-integration-20261017]
permissions:
  contents: read
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Backend unit and security integration tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Audit all dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: JavaScript syntax and frontend build regression checks
        run: node scripts/verify-build.js
