name: Prepare backend dependency security fixes
on:
  workflow_dispatch:
  push:
    branches: [security/devshield-integration-20261017]
    paths: [.github/workflows/prepare-dependency-fixes.yml]
permissions:
  contents: read
jobs:
  prepare-fixes:
    if: github.ref == 'refs/heads/security/devshield-integration-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/devshield-integration-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve compatible dependency updates
        working-directory: backend
        run: |
          npm install --package-lock-only --ignore-scripts
          # npm audit fix exits 1 when advisories remain. Preserve its work,
          # then fail at the explicit audit gate below; infrastructure errors fail here.
          status=0
          npm audit fix --package-lock-only --ignore-scripts || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high
      - name: Commit verified lockfile to the security branch
        run: |
          git add backend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "security: regenerate audited backend lockfile"
          # Never force-push or touch main. A concurrent update rejects this push.
          git push origin HEAD:security/devshield-integration-20261017
