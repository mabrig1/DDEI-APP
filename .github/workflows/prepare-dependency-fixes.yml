name: Prepare backend dependency security fixes
on:
  workflow_dispatch:
  push:
    branches:
      - security/devshield-integration-20261017
    paths:
      - .github/workflows/prepare-dependency-fixes.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply compatible npm security fixes
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm test
      - name: Audit remaining production vulnerabilities
        id: audit
        continue-on-error: true
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Propose reviewed lockfile update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: security/backend-npm-audit-fixes
          delete-branch: true
          commit-message: 'security: apply compatible npm audit dependency fixes'
          title: 'security: update backend dependencies for npm advisories'
          body: 'Automated compatible npm audit fixes. Review package-lock diff, tests, and security checks before merging. No force upgrades.'
          add-paths: backend/package-lock.json
          draft: true
      - name: Fail if unresolved high-severity advisories remain
        if: steps.audit.outcome == 'failure'
        run: |
          echo 'High-severity vulnerabilities remain after compatible fixes; inspect the proposed PR and plan manual remediation.'
          exit 1
