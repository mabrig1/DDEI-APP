name: Seed Admin User

on:
  workflow_dispatch:
    inputs:
      mongodb_uri:
        description: 'MongoDB Atlas Connection String'
        required: true
        type: string
      admin_password:
        description: 'New Admin Password'
        required: true
        type: string

jobs:
  seed-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Required Packages
        run: |
          # Ensure a package.json exists so npm installs dependencies into the workspace
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --no-audit --no-fund mongoose bcryptjs

      - name: Execute Admin Seed
        env:
          MONGODB_URI: ${{ inputs.mongodb_uri }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          cat << 'EOF' > run_seed.js
          const mongoose = require('mongoose');
          const bcrypt = require('bcryptjs');

          const rawUri = process.env.MONGODB_URI.trim();
          const password = process.env.ADMIN_PASSWORD.trim();

          async function run() {
            try {
              console.log('Connecting to MongoDB Atlas...');
              await mongoose.connect(rawUri);
              console.log('Connected successfully.');

              const hash = await bcrypt.hash(password, 10);
              const db = mongoose.connection.db;

              await db.collection('users').updateOne(
                { username: 'Admin' },
                { $set: { password: hash, role: 'admin' } },
                { upsert: true }
              );

              console.log('Admin password successfully updated in MongoDB Atlas!');
              process.exit(0);
            } catch (err) {
              console.error('Execution Failed:', err.message);
              process.exit(1);
            }
          }

          run();
          EOF
          node run_seed.js
