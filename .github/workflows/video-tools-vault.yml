name: Video tools vault checks

on:
  pull_request:
    paths:
      - 'backend/src/data/videoToolsVault.js'
      - 'backend/src/controllers/vaultController.js'
      - 'backend/src/scripts/auditVideoToolLinks.js'
      - 'backend/src/data/courses.js'
      - 'backend/test/videoToolsVault.test.js'
      - 'frontend/tools-vault.html'
      - 'frontend/links.html'
      - 'frontend/index.html'
      - 'docs/VIDEO_TOOLS_VAULT_REVIEW.md'
      - '.github/workflows/video-tools-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Run backend tests
        run: npm test
        working-directory: backend
      - name: Build frontend
        run: node build.js
        working-directory: frontend
      - name: Verify JS syntax
        run: |
          node --check backend/src/data/videoToolsVault.js
          node --check backend/src/scripts/auditVideoToolLinks.js
