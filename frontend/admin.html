<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Destiny Skills Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <nav class="bg-white border-b">
        <div class="max-w-screen-xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-[#0A66C2] rounded-2xl flex items-center justify-center">
                    <span class="text-white font-bold text-2xl">DS</span>
                </div>
                <span class="font-display text-xl font-semibold tracking-tighter">Admin Dashboard</span>
            </div>
            <button id="logoutBtn" class="hidden px-4 py-2 text-sm font-semibold border rounded-xl hover:bg-slate-50">Log Out</button>
        </div>
    </nav>

    <!-- Login screen -->
    <div id="loginScreen" class="max-w-sm mx-auto mt-24 bg-white border rounded-3xl p-8">
        <h1 class="font-display text-2xl mb-1">Admin Login</h1>
        <p class="text-slate-500 text-sm mb-6">Sign in to manage applications.</p>
        <form id="loginForm">
            <label class="block text-sm font-medium mb-1">Username</label>
            <input id="loginUsername" type="text" required class="w-full border rounded-xl px-4 py-2 mb-4" autocomplete="username">
            <label class="block text-sm font-medium mb-1">Password</label>
            <input id="loginPassword" type="password" required class="w-full border rounded-xl px-4 py-2 mb-4" autocomplete="current-password">
            <p id="loginError" class="text-red-600 text-sm mb-4 hidden"></p>
            <button type="submit" class="w-full py-3 bg-[#0A66C2] text-white font-semibold rounded-2xl">Log In</button>
        </form>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden max-w-screen-xl mx-auto px-6 py-10">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-x-2" id="tabBar">
                <button data-tab="applications" class="tab-btn px-4 py-2 text-sm font-semibold rounded-xl">Applications</button>
                <button data-tab="users" class="tab-btn px-4 py-2 text-sm font-semibold rounded-xl">Users</button>
                <button data-tab="subscriptions" class="tab-btn px-4 py-2 text-sm font-semibold rounded-xl">Payments</button>
                <button data-tab="content" class="tab-btn px-4 py-2 text-sm font-semibold rounded-xl">Pages &amp; Posts</button>
            </div>
            <div class="flex items-center gap-x-2">
                <button id="newContentBtn" class="hidden px-4 py-2 text-sm font-semibold bg-emerald-600 text-white rounded-xl hover:opacity-90">+ New Page/Post</button>
                <button id="fullAccessBtn" class="px-4 py-2 text-sm font-semibold bg-[#0A66C2] text-white rounded-xl hover:opacity-90">Full App Access</button>
                <button id="refreshBtn" class="px-4 py-2 text-sm font-semibold border rounded-xl hover:bg-slate-50">Refresh</button>
            </div>
        </div>

        <div id="genericEmpty" class="hidden bg-white border rounded-3xl p-10 text-center text-slate-500"></div>
        <div id="genericError" class="hidden text-red-600 text-sm mb-4"></div>

        <!-- Applications tab -->
        <div id="tab-applications" class="tab-panel bg-white border rounded-3xl overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3">Name</th>
                        <th class="px-4 py-3">Contact</th>
                        <th class="px-4 py-3">Country</th>
                        <th class="px-4 py-3">Track</th>
                        <th class="px-4 py-3">Tier</th>
                        <th class="px-4 py-3">Why they want to join</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">Scholarship</th>
                        <th class="px-4 py-3">Applied</th>
                    </tr>
                </thead>
                <tbody id="applicationsBody"></tbody>
            </table>
        </div>

        <!-- Users tab -->
        <div id="tab-users" class="tab-panel hidden bg-white border rounded-3xl overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3">Name</th>
                        <th class="px-4 py-3">Email</th>
                        <th class="px-4 py-3">Track</th>
                        <th class="px-4 py-3">Premium</th>
                        <th class="px-4 py-3">Access</th>
                        <th class="px-4 py-3">Lessons Completed</th>
                        <th class="px-4 py-3">Joined</th>
                        <th class="px-4 py-3"></th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>

        <!-- Subscriptions tab -->
        <div id="tab-subscriptions" class="tab-panel hidden bg-white border rounded-3xl overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3">User</th>
                        <th class="px-4 py-3">Plan</th>
                        <th class="px-4 py-3">Amount</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">Reference</th>
                        <th class="px-4 py-3">Date</th>
                    </tr>
                </thead>
                <tbody id="subscriptionsBody"></tbody>
            </table>
        </div>

        <!-- Pages & Posts tab -->
        <div id="tab-content" class="tab-panel hidden bg-white border rounded-3xl overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3">Title</th>
                        <th class="px-4 py-3">Type</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">Slug</th>
                        <th class="px-4 py-3">Updated</th>
                        <th class="px-4 py-3"></th>
                    </tr>
                </thead>
                <tbody id="contentBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Content editor modal -->
    <div id="contentModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 id="contentModalTitle" class="font-display text-xl">New Page/Post</h2>
                <button id="contentModalCloseBtn" class="text-slate-400 hover:text-slate-700">&times;</button>
            </div>
            <form id="contentForm">
                <label class="block text-sm font-medium mb-1">Title</label>
                <input id="contentTitleInput" type="text" required class="w-full border rounded-xl px-4 py-2 mb-4">

                <label class="block text-sm font-medium mb-1">Slug</label>
                <input id="contentSlugInput" type="text" class="w-full border rounded-xl px-4 py-2 mb-4" placeholder="Auto-generated from title">

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Type</label>
                        <select id="contentTypeInput" class="w-full border rounded-xl px-4 py-2">
                            <option value="page">Page</option>
                            <option value="post">Post</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Status</label>
                        <select id="contentStatusInput" class="w-full border rounded-xl px-4 py-2">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                </div>

                <label class="block text-sm font-medium mb-1">Excerpt</label>
                <textarea id="contentExcerptInput" rows="2" class="w-full border rounded-xl px-4 py-2 mb-4"></textarea>

                <label class="block text-sm font-medium mb-1">Featured Image URL</label>
                <input id="contentImageInput" type="text" class="w-full border rounded-xl px-4 py-2 mb-4" placeholder="https://...">

                <label class="block text-sm font-medium mb-1">Body (HTML)</label>
                <textarea id="contentBodyInput" rows="10" required class="w-full border rounded-xl px-4 py-2 mb-4 font-mono text-xs"></textarea>

                <p id="contentFormError" class="text-red-600 text-sm mb-4 hidden"></p>

                <div class="flex items-center justify-between">
                    <button id="contentDeleteBtn" type="button" class="hidden text-red-600 text-sm font-semibold hover:underline">Delete</button>
                    <div class="flex-1"></div>
                    <button id="contentSaveBtn" type="submit" class="px-6 py-3 bg-[#0A66C2] text-white font-semibold rounded-2xl">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.DSB_API_BASE_URL || 'http://localhost:5000';

        function adminToken() { return localStorage.getItem('dsb_admin_token'); }
        function setAdminToken(token) { localStorage.setItem('dsb_admin_token', token); }
        function clearAdminToken() { localStorage.removeItem('dsb_admin_token'); }

        async function adminRequest(path, options = {}) {
            const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
            const token = adminToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            const response = await fetch(`${API_BASE_URL}${path}`, Object.assign({}, options, { headers }));
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || 'Request failed');
            return data;
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            switchTab(currentTab);
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.classList.add('hidden');
            try {
                const data = await adminRequest('/api/admin/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                setAdminToken(data.token);
                showDashboard();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            clearAdminToken();
            showLogin();
        });

        let currentTab = 'applications';
        const TABS = {
            applications: { load: loadApplications },
            users: { load: loadUsers },
            subscriptions: { load: loadSubscriptions },
            content: { load: loadContent },
        };

        document.querySelectorAll('.tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach((btn) => {
                const active = btn.dataset.tab === tab;
                btn.classList.toggle('bg-[#0A66C2]', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('border', !active);
                btn.classList.toggle('text-slate-600', !active);
            });
            document.querySelectorAll('.tab-panel').forEach((panel) => {
                panel.classList.toggle('hidden', panel.id !== `tab-${tab}`);
            });
            document.getElementById('newContentBtn').classList.toggle('hidden', tab !== 'content');
            TABS[tab].load();
        }

        document.getElementById('refreshBtn').addEventListener('click', () => TABS[currentTab].load());

        document.getElementById('fullAccessBtn').addEventListener('click', async () => {
            const btn = document.getElementById('fullAccessBtn');
            btn.disabled = true;
            try {
                const data = await adminRequest('/api/admin/access-link', { method: 'POST' });
                const url = `${window.location.origin}/?adminAccess=${encodeURIComponent(data.token)}`;
                window.open(url, '_blank');
            } catch (err) {
                alert(`Could not generate access link: ${err.message}`);
            } finally {
                btn.disabled = false;
            }
        });

        const STATUS_OPTIONS = ['pending', 'reviewing', 'accepted', 'rejected'];

        function resetListUI() {
            const errorEl = document.getElementById('genericError');
            const emptyEl = document.getElementById('genericEmpty');
            errorEl.classList.add('hidden');
            emptyEl.classList.add('hidden');
            return { errorEl, emptyEl };
        }

        function handleListError(err, errorEl) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
            if (err.message === 'Invalid or expired token' || err.message === 'Authentication required') {
                clearAdminToken();
                showLogin();
            }
        }

        async function loadApplications() {
            const { errorEl, emptyEl } = resetListUI();
            const body = document.getElementById('applicationsBody');
            body.innerHTML = '';

            try {
                const data = await adminRequest('/api/admin/applications');
                const applications = data.applications || [];
                if (applications.length === 0) {
                    emptyEl.textContent = 'No applications yet.';
                    emptyEl.classList.remove('hidden');
                    return;
                }
                applications.forEach((app) => body.appendChild(renderApplicationRow(app)));
            } catch (err) {
                handleListError(err, errorEl);
            }
        }

        async function loadUsers() {
            const { errorEl, emptyEl } = resetListUI();
            const body = document.getElementById('usersBody');
            body.innerHTML = '';

            try {
                const data = await adminRequest('/api/admin/users');
                const users = data.users || [];
                if (users.length === 0) {
                    emptyEl.textContent = 'No registered users yet.';
                    emptyEl.classList.remove('hidden');
                    return;
                }
                users.forEach((user) => body.appendChild(renderUserRow(user)));
            } catch (err) {
                handleListError(err, errorEl);
            }
        }

        async function loadSubscriptions() {
            const { errorEl, emptyEl } = resetListUI();
            const body = document.getElementById('subscriptionsBody');
            body.innerHTML = '';

            try {
                const data = await adminRequest('/api/admin/subscriptions');
                const subscriptions = data.subscriptions || [];
                if (subscriptions.length === 0) {
                    emptyEl.textContent = 'No payments yet.';
                    emptyEl.classList.remove('hidden');
                    return;
                }
                subscriptions.forEach((sub) => body.appendChild(renderSubscriptionRow(sub)));
            } catch (err) {
                handleListError(err, errorEl);
            }
        }

        async function loadContent() {
            const { errorEl, emptyEl } = resetListUI();
            const body = document.getElementById('contentBody');
            body.innerHTML = '';

            try {
                const data = await adminRequest('/api/content/admin/all');
                const items = data.content || [];
                if (items.length === 0) {
                    emptyEl.textContent = 'No pages or posts yet.';
                    emptyEl.classList.remove('hidden');
                    return;
                }
                items.forEach((item) => body.appendChild(renderContentRow(item)));
            } catch (err) {
                handleListError(err, errorEl);
            }
        }

        function renderContentRow(item) {
            const tr = document.createElement('tr');
            tr.className = 'border-t';
            tr.innerHTML = `
                <td class="px-4 py-3 font-medium">${escapeHtml(item.title)}</td>
                <td class="px-4 py-3 capitalize">${escapeHtml(item.type)}</td>
                <td class="px-4 py-3 capitalize">${escapeHtml(item.status)}</td>
                <td class="px-4 py-3 text-slate-500">${escapeHtml(item.slug)}</td>
                <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${new Date(item.updatedAt).toLocaleDateString()}</td>
                <td class="px-4 py-3"></td>
            `;
            const editBtn = document.createElement('button');
            editBtn.textContent = 'Edit';
            editBtn.className = 'text-[#0A66C2] text-xs font-semibold hover:underline';
            editBtn.addEventListener('click', () => openContentModal(item));
            tr.children[5].appendChild(editBtn);
            return tr;
        }

        let editingContentId = null;
        let contentSlugTouched = false;

        function openContentModal(item) {
            editingContentId = item ? item._id : null;
            contentSlugTouched = false;
            document.getElementById('contentModalTitle').textContent = item ? 'Edit Page/Post' : 'New Page/Post';
            document.getElementById('contentTitleInput').value = item ? item.title : '';
            document.getElementById('contentSlugInput').value = item ? item.slug : '';
            document.getElementById('contentTypeInput').value = item ? item.type : 'page';
            document.getElementById('contentStatusInput').value = item ? item.status : 'draft';
            document.getElementById('contentExcerptInput').value = item ? item.excerpt || '' : '';
            document.getElementById('contentImageInput').value = item ? item.featuredImageUrl || '' : '';
            document.getElementById('contentBodyInput').value = item ? item.body : '';
            document.getElementById('contentFormError').classList.add('hidden');
            document.getElementById('contentDeleteBtn').classList.toggle('hidden', !item);
            document.getElementById('contentModal').classList.remove('hidden');
        }

        function closeContentModal() {
            document.getElementById('contentModal').classList.add('hidden');
        }

        document.getElementById('newContentBtn').addEventListener('click', () => openContentModal(null));
        document.getElementById('contentModalCloseBtn').addEventListener('click', closeContentModal);

        document.getElementById('contentSlugInput').addEventListener('input', () => {
            contentSlugTouched = true;
        });
        document.getElementById('contentTitleInput').addEventListener('input', (e) => {
            if (!contentSlugTouched && !editingContentId) {
                document.getElementById('contentSlugInput').value = e.target.value
                    .toLowerCase()
                    .trim()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '');
            }
        });

        document.getElementById('contentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('contentFormError');
            errorEl.classList.add('hidden');
            const payload = {
                title: document.getElementById('contentTitleInput').value.trim(),
                slug: document.getElementById('contentSlugInput').value.trim(),
                type: document.getElementById('contentTypeInput').value,
                status: document.getElementById('contentStatusInput').value,
                excerpt: document.getElementById('contentExcerptInput').value,
                featuredImageUrl: document.getElementById('contentImageInput').value.trim(),
                body: document.getElementById('contentBodyInput').value,
            };
            const saveBtn = document.getElementById('contentSaveBtn');
            saveBtn.disabled = true;
            try {
                if (editingContentId) {
                    await adminRequest(`/api/content/admin/${editingContentId}`, {
                        method: 'PATCH',
                        body: JSON.stringify(payload),
                    });
                } else {
                    await adminRequest('/api/content/admin', {
                        method: 'POST',
                        body: JSON.stringify(payload),
                    });
                }
                closeContentModal();
                loadContent();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            } finally {
                saveBtn.disabled = false;
            }
        });

        document.getElementById('contentDeleteBtn').addEventListener('click', async () => {
            if (!editingContentId) return;
            if (!confirm('Delete this page/post? This cannot be undone.')) return;
            try {
                await adminRequest(`/api/content/admin/${editingContentId}`, { method: 'DELETE' });
                closeContentModal();
                loadContent();
            } catch (err) {
                alert(`Failed to delete: ${err.message}`);
            }
        });

        let courseCatalogPromise = null;

        async function getCourseCatalog() {
            if (courseCatalogPromise) return courseCatalogPromise;
            courseCatalogPromise = (async () => {
                const courseMap = {};
                const lessonMap = {};
                const quizMap = {};
                try {
                    const { courses } = await fetch(`${API_BASE_URL}/api/courses`).then((r) => r.json());
                    for (const summary of courses || []) {
                        const { course } = await fetch(`${API_BASE_URL}/api/courses/${summary.id}`).then((r) => r.json());
                        if (!course) continue;
                        courseMap[course.id] = course.title;
                        (course.modules || []).forEach((mod) => {
                            (mod.lessons || []).forEach((lesson) => {
                                lessonMap[lesson.id] = { title: lesson.title, courseTitle: course.title };
                            });
                            if (mod.quiz) {
                                quizMap[mod.quiz.id] = { title: `${mod.title} Quiz`, courseTitle: course.title };
                            }
                        });
                    }
                } catch (err) {
                    // Catalog lookup is best-effort; fall back to raw ids if it fails.
                }
                return { courseMap, lessonMap, quizMap };
            })();
            return courseCatalogPromise;
        }

        function accessStatusHTML(user) {
            if (user.scholarship === 'full') return '<span class="text-emerald-600 font-medium">Full Scholarship</span>';
            if (user.scholarship === 'limited') return '<span class="text-emerald-600 font-medium">Limited Scholarship</span>';
            if (user.isPremium) return '<span class="text-emerald-600 font-medium">Premium</span>';
            if (!user.trialExpiresAt) return '<span class="text-slate-400">—</span>';
            const daysLeft = Math.ceil((new Date(user.trialExpiresAt) - new Date()) / (24 * 60 * 60 * 1000));
            if (daysLeft <= 0) return '<span class="text-red-600 font-medium">Trial expired</span>';
            return `<span class="text-amber-600">Trial: ${daysLeft}d left</span>`;
        }

        function renderUserRow(user) {
            const tr = document.createElement('tr');
            tr.className = 'border-t';
            const lessonsCompleted = (user.courseProgress || []).reduce(
                (sum, cp) => sum + (cp.completedLessons || []).length,
                0
            );
            tr.innerHTML = `
                <td class="px-4 py-3 font-medium">${escapeHtml(user.name)}</td>
                <td class="px-4 py-3 text-slate-500">${escapeHtml(user.email)}</td>
                <td class="px-4 py-3">${escapeHtml(user.track || '—')}</td>
                <td class="px-4 py-3">${user.isPremium ? 'Yes' : 'No'}</td>
                <td class="px-4 py-3">${accessStatusHTML(user)}</td>
                <td class="px-4 py-3">${lessonsCompleted}</td>
                <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${new Date(user.createdAt).toLocaleDateString()}</td>
                <td class="px-4 py-3"></td>
            `;

            const detailTr = document.createElement('tr');
            detailTr.className = 'border-t bg-slate-50 hidden';
            const detailTd = document.createElement('td');
            detailTd.colSpan = 8;
            detailTd.className = 'px-4 py-4 text-sm';
            detailTd.textContent = 'Loading progress…';
            detailTr.appendChild(detailTd);

            const toggleBtn = document.createElement('button');
            toggleBtn.textContent = 'View Progress';
            toggleBtn.className = 'text-[#0A66C2] text-xs font-semibold hover:underline mr-3';
            toggleBtn.addEventListener('click', async () => {
                const isHidden = detailTr.classList.contains('hidden');
                if (!isHidden) {
                    detailTr.classList.add('hidden');
                    return;
                }
                detailTr.classList.remove('hidden');
                const catalog = await getCourseCatalog();
                detailTd.innerHTML = renderProgressDetail(user, catalog);
            });

            const premiumCell = tr.children[3];
            const accessCell = tr.children[4];
            const premiumBtn = document.createElement('button');
            premiumBtn.className = 'text-xs font-semibold hover:underline';
            const renderPremiumBtn = () => {
                premiumCell.textContent = user.isPremium ? 'Yes' : 'No';
                premiumBtn.textContent = user.isPremium ? 'Revoke' : 'Grant';
                premiumBtn.className = user.isPremium
                    ? 'text-xs font-semibold text-red-600 hover:underline ml-2'
                    : 'text-xs font-semibold text-[#0A66C2] hover:underline ml-2';
                premiumCell.appendChild(premiumBtn);
                accessCell.innerHTML = accessStatusHTML(user);
            };
            premiumBtn.addEventListener('click', async () => {
                const next = !user.isPremium;
                premiumBtn.disabled = true;
                try {
                    await adminRequest(`/api/admin/users/${user._id}/premium`, {
                        method: 'PATCH',
                        body: JSON.stringify({ isPremium: next }),
                    });
                    user.isPremium = next;
                    renderPremiumBtn();
                } catch (err) {
                    alert(`Failed to update premium status: ${err.message}`);
                } finally {
                    premiumBtn.disabled = false;
                }
            });
            renderPremiumBtn();

            const setPasswordBtn = document.createElement('button');
            setPasswordBtn.textContent = 'Set Password';
            setPasswordBtn.className = 'text-xs font-semibold text-[#0A66C2] hover:underline mr-3';
            setPasswordBtn.addEventListener('click', async () => {
                const newPassword = prompt(`Set a new password for ${user.email}:`);
                if (!newPassword) return;
                if (newPassword.length < 6) {
                    alert('Password must be at least 6 characters.');
                    return;
                }
                setPasswordBtn.disabled = true;
                try {
                    await adminRequest(`/api/admin/users/${user._id}/password`, {
                        method: 'PATCH',
                        body: JSON.stringify({ password: newPassword }),
                    });
                    alert(`Password updated for ${user.email}.`);
                } catch (err) {
                    alert(`Failed to update password: ${err.message}`);
                } finally {
                    setPasswordBtn.disabled = false;
                }
            });

            tr.children[7].appendChild(setPasswordBtn);
            tr.children[7].appendChild(toggleBtn);

            const fragment = document.createDocumentFragment();
            fragment.appendChild(tr);
            fragment.appendChild(detailTr);
            return fragment;
        }

        function renderProgressDetail(user, catalog) {
            const progress = user.courseProgress || [];
            if (progress.length === 0) {
                return '<span class="text-slate-500">No course activity yet.</span>';
            }
            return progress
                .map((cp) => {
                    const courseTitle = catalog.courseMap[cp.courseId] || cp.courseId;
                    const lessons = (cp.completedLessons || [])
                        .map((id) => escapeHtml(catalog.lessonMap[id]?.title || id))
                        .join(', ') || 'None yet';
                    const quizzes = (cp.quizAttempts || [])
                        .map((qa) => {
                            const title = escapeHtml(catalog.quizMap[qa.lessonId]?.title || qa.lessonId);
                            const date = qa.attemptedAt ? new Date(qa.attemptedAt).toLocaleDateString() : '';
                            return `${title}: ${qa.score}/${qa.total} (${date})`;
                        })
                        .join('<br>') || 'No quiz attempts yet';
                    return `
                        <div class="mb-3">
                            <p class="font-semibold mb-1">${escapeHtml(courseTitle)}</p>
                            <p class="text-slate-600"><strong>Completed lessons:</strong> ${lessons}</p>
                            <p class="text-slate-600"><strong>Quiz attempts:</strong><br>${quizzes}</p>
                        </div>
                    `;
                })
                .join('');
        }

        function renderSubscriptionRow(sub) {
            const tr = document.createElement('tr');
            tr.className = 'border-t';
            tr.innerHTML = `
                <td class="px-4 py-3 font-medium">${escapeHtml(sub.user ? sub.user.name : 'Unknown')}<br><span class="text-slate-500 text-xs">${escapeHtml(sub.user ? sub.user.email : '')}</span></td>
                <td class="px-4 py-3">${escapeHtml(sub.plan)}</td>
                <td class="px-4 py-3">${escapeHtml(String(sub.amount))} ${escapeHtml(sub.currency)}</td>
                <td class="px-4 py-3">${escapeHtml(sub.status)}</td>
                <td class="px-4 py-3 text-slate-500">${escapeHtml(sub.reference)}</td>
                <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${new Date(sub.createdAt).toLocaleDateString()}</td>
            `;
            return tr;
        }

        const SCHOLARSHIP_OPTIONS = ['none', 'limited', 'full'];
        const SCHOLARSHIP_LABELS = { none: 'No scholarship', limited: 'Limited access', full: 'Full access' };

        function renderApplicationRow(app) {
            const tr = document.createElement('tr');
            tr.className = 'border-t';

            const select = document.createElement('select');
            select.className = 'border rounded-lg px-2 py-1 text-xs';
            STATUS_OPTIONS.forEach((status) => {
                const opt = document.createElement('option');
                opt.value = status;
                opt.textContent = status;
                if (status === app.status) opt.selected = true;
                select.appendChild(opt);
            });
            select.addEventListener('change', async () => {
                select.disabled = true;
                try {
                    await adminRequest(`/api/admin/applications/${app._id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: select.value }),
                    });
                } catch (err) {
                    alert(`Failed to update status: ${err.message}`);
                    select.value = app.status;
                } finally {
                    select.disabled = false;
                }
            });

            const scholarshipSelect = document.createElement('select');
            scholarshipSelect.className = 'border rounded-lg px-2 py-1 text-xs';
            SCHOLARSHIP_OPTIONS.forEach((level) => {
                const opt = document.createElement('option');
                opt.value = level;
                opt.textContent = SCHOLARSHIP_LABELS[level];
                if (level === (app.scholarship || 'none')) opt.selected = true;
                scholarshipSelect.appendChild(opt);
            });
            scholarshipSelect.addEventListener('change', async () => {
                scholarshipSelect.disabled = true;
                try {
                    const data = await adminRequest(`/api/admin/applications/${app._id}/scholarship`, {
                        method: 'PATCH',
                        body: JSON.stringify({ level: scholarshipSelect.value }),
                    });
                    app.scholarship = scholarshipSelect.value;
                    if (data.tempPassword) {
                        alert(
                            `A new account was created for ${app.email}.\n\nTemporary password: ${data.tempPassword}\n\nShare this with the applicant — email delivery is not guaranteed in sandbox mode.`
                        );
                    }
                } catch (err) {
                    alert(`Failed to update scholarship: ${err.message}`);
                    scholarshipSelect.value = app.scholarship || 'none';
                } finally {
                    scholarshipSelect.disabled = false;
                }
            });

            tr.innerHTML = `
                <td class="px-4 py-3 font-medium">${escapeHtml(app.fullName)}</td>
                <td class="px-4 py-3 text-slate-500">${escapeHtml(app.email)}<br>${escapeHtml(app.phone)}</td>
                <td class="px-4 py-3">${escapeHtml(app.country)}</td>
                <td class="px-4 py-3">${escapeHtml(app.track)}</td>
                <td class="px-4 py-3">${escapeHtml(app.tier)}</td>
                <td class="px-4 py-3 max-w-xs text-slate-500">${escapeHtml(app.motivation)}</td>
                <td class="px-4 py-3"></td>
                <td class="px-4 py-3"></td>
                <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${new Date(app.createdAt).toLocaleDateString()}</td>
            `;
            tr.children[6].appendChild(select);
            tr.children[7].appendChild(scholarshipSelect);
            return tr;
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        if (adminToken()) {
            showDashboard();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
